<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="hEmblemBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </radialGradient>

    <!-- Gold Gradient -->
    <linearGradient id="hGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Left Emblem Group (X: 10 to 74, Y: 8 to 72) -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="30" fill="url(#hEmblemBg)" stroke="url(#hGold)" stroke-width="2.5" />
    <!-- Crown -->
    <path d="M 22 17 L 18 10 L 26 13 L 32 8 L 38 13 L 46 10 L 42 17 Z" fill="url(#hGold)" stroke="#FEF3C7" stroke-width="0.8" stroke-linejoin="round" />
    <circle cx="18" cy="10" r="1.2" fill="#FEF3C7" />
    <circle cx="32" cy="8" r="1.5" fill="#FEF3C7" />
    <circle cx="46" cy="10" r="1.2" fill="#FEF3C7" />

    <!-- Rooster Head (White) -->
    <path d="M 26 19 C 28 17 36 17 38 19 C 41 21 43 25 41 31 C 39 35 38 39 38 43 L 26 43 C 26 39 25 35 23 31 C 21 25 23 21 26 19 Z" fill="#FFFFFF" />
    <!-- Comb -->
    <path d="M 28 18 C 27 14 30 13 32 15 C 34 13 37 14 36 18 Z" fill="#EF4444" />
    <!-- Beak -->
    <polygon points="38,24 47,27 38,30" fill="url(#hGold)" stroke="#B45309" stroke-width="0.8" />
    <!-- Eye -->
    <circle cx="33" cy="25" r="1.8" fill="#0F172A" />
    <circle cx="33.5" cy="24.5" r="0.6" fill="#FFFFFF" />
    <!-- Small Ribbon -->
    <path d="M 18 45 L 46 45 L 43 50 L 21 50 Z" fill="url(#hGold)" />
  </g>

  <!-- Typography Right Side (in RTL Arabic context) -->
  <!-- Arabic Brand Name -->
  <text x="86" y="38" font-family="'Cairo', system-ui, sans-serif" font-weight="900" font-size="26" fill="#DC2626">
    تشيكن <tspan fill="url(#hGold)">مراعي</tspan>
  </text>

  <!-- Subtitle English -->
  <text x="86" y="56" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11" fill="#94A3B8" letter-spacing="1.5">
    CHICKEN MARAEI • FRIED CHICKEN
  </text>

  <!-- Slogan Badge -->
  <rect x="86" y="62" width="95" height="15" rx="4" fill="#DC2626" fill-opacity="0.15" stroke="#DC2626" stroke-width="0.8" />
  <text x="133" y="73" font-family="'Cairo', system-ui, sans-serif" font-weight="700" font-size="9.5" fill="#EF4444" text-anchor="middle">
    ★ لأكيلة مراعي ★
  </text>
</svg>
