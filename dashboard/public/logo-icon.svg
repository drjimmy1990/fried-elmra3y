<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="60%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#450A0A" />
    </radialGradient>

    <!-- Gold Gradient for Crown & Wings -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Chrome Gold Shimmer -->
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Inner Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Circular Shield with Gold Border -->
  <circle cx="256" cy="256" r="246" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14" filter="url(#glow)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#FEF3C7" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6,4" />

  <!-- Outer Wing Arcs / Laurel Flares -->
  <g filter="url(#goldGlow)">
    <!-- Left Wing Layers -->
    <path d="M 120 310 C 80 260 85 190 135 150 C 130 175 140 205 165 225 C 135 220 120 250 125 285 Z" fill="url(#goldGrad)" />
    <path d="M 85 270 C 65 225 75 180 110 150 C 105 175 115 200 135 215 C 105 215 95 240 100 270 Z" fill="url(#shimmerGrad)" opacity="0.8" />
    
    <!-- Right Wing Layers -->
    <path d="M 392 310 C 432 260 427 190 377 150 C 382 175 372 205 347 225 C 377 220 392 250 387 285 Z" fill="url(#goldGrad)" />
    <path d="M 427 270 C 447 225 437 180 402 150 C 407 175 397 200 377 215 C 407 215 417 240 412 270 Z" fill="url(#shimmerGrad)" opacity="0.8" />
  </g>

  <!-- Royal Crown (Top) -->
  <g filter="url(#goldGlow)">
    <!-- Crown Base -->
    <path d="M 196 142 L 316 142 L 306 156 L 206 156 Z" fill="url(#shimmerGrad)" />
    <circle cx="216" cy="149" r="3" fill="#DC2626" />
    <circle cx="256" cy="149" r="4" fill="#DC2626" />
    <circle cx="296" cy="149" r="3" fill="#DC2626" />

    <!-- Crown Peaks -->
    <path d="M 196 142 L 180 92 L 222 118 L 256 75 L 290 118 L 332 92 L 316 142 Z" fill="url(#goldGrad)" stroke="#FEF3C7" stroke-width="2" stroke-linejoin="round" />
    <!-- Crown Jewels / Spheres -->
    <circle cx="180" cy="90" r="7" fill="url(#shimmerGrad)" />
    <circle cx="256" cy="73" r="9" fill="url(#shimmerGrad)" />
    <circle cx="332" cy="90" r="7" fill="url(#shimmerGrad)" />
  </g>

  <!-- Chicken / Rooster Head & Crest Profile -->
  <!-- Rooster Comb (Red fiery top) -->
  <path d="M 235 152 C 225 130 245 125 255 135 C 265 120 285 125 285 140 C 295 132 305 145 295 158 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="2" />

  <!-- Head Base -->
  <path d="M 230 156 C 240 150 272 150 282 156 C 295 165 305 185 295 210 C 285 235 280 255 280 270 L 232 270 C 232 255 227 235 217 210 C 207 185 217 165 230 156 Z" fill="#FFFFFF" />

  <!-- Sharp Golden Beak -->
  <polygon points="285,182 328,198 285,212" fill="url(#goldGrad)" stroke="#B45309" stroke-width="2" stroke-linejoin="round" />
  <!-- Wattle (Red throat fleshy lobe) -->
  <path d="M 275 212 C 290 220 295 240 285 250 C 275 255 268 245 272 230 Z" fill="#DC2626" />

  <!-- Eyes with keen focus -->
  <circle cx="264" cy="184" r="8" fill="#1E293B" />
  <circle cx="266" cy="182" r="3" fill="#FFFFFF" />

  <!-- Chicken Breast / Shield Body -->
  <path d="M 205 260 C 205 240 307 240 307 260 C 315 295 320 330 256 360 C 192 330 197 295 205 260 Z" fill="#FFFFFF" opacity="0.95" />
  <path d="M 225 268 C 240 260 272 260 287 268 C 292 295 285 325 256 345 C 227 325 220 295 225 268 Z" fill="#F8FAFC" />
  <!-- Decorative Golden Neck Feathers -->
  <path d="M 240 275 L 256 300 L 272 275 L 285 295 L 256 335 L 227 295 Z" fill="url(#goldGrad)" opacity="0.85" />

  <!-- Ribbon Banner with Text "CHICKEN MARAEI" -->
  <g filter="url(#glow)">
    <!-- Ribbon ends -->
    <path d="M 70 410 L 120 375 L 120 425 Z" fill="#78350F" />
    <path d="M 442 410 L 392 375 L 392 425 Z" fill="#78350F" />
    
    <!-- Ribbon Main Body -->
    <path d="M 95 385 C 190 365 322 365 417 385 L 405 435 C 320 415 192 415 107 435 Z" fill="url(#goldGrad)" stroke="#FEF3C7" stroke-width="2" />
    
    <!-- Text on Ribbon -->
    <text x="256" y="414" font-family="'Cairo', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="28" fill="#450A0A" text-anchor="middle" letter-spacing="1">
      CHICKEN MARAEI
    </text>
  </g>

  <!-- Arabic Brand Name Below Ribbon -->
  <text x="256" y="465" font-family="'Cairo', Arial, sans-serif" font-weight="900" font-size="30" fill="#FEF3C7" text-anchor="middle" letter-spacing="0.5">
    تشيكن مراعي
  </text>
  <text x="256" y="490" font-family="'Cairo', Arial, sans-serif" font-weight="700" font-size="16" fill="#FBBF24" text-anchor="middle">
    ★ لأكيلة مراعي ★
  </text>
</svg>
